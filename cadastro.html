<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTech Academy — Cadastro</title>
  <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #e8f0ff 0%, #ffffff 100%);
      min-height: 100vh;
    }
    .navbar {
      background: #7aa7b2;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    .form-label {
      font-weight: 600;
    }
    .btn-modern {
      background: linear-gradient(90deg, #7aa7b2, #62919c);
      border: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .btn-modern:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }
    .table thead {
      background: #4e54c8;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./indice.html">DevTech Academy</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="./cadastro.html" class="nav-link active">Cadastro</a></li>
          <li class="nav-item"><a href="./relatorio.html" class="nav-link">Relatórios</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card p-4 mb-4 bg-white">
          <h3 class="text-center text-primary mb-3">Formulário de Cadastro do Aluno</h3>
          <p class="text-center text-muted mb-4">
            Preencha as informações abaixo para cadastrar o aluno no sistema.
          </p>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="idnome" class="form-label">Nome Completo</label>
              <input id="idnome" type="text" class="form-control" placeholder="Digite o nome do aluno" />
            </div>

            <div class="col-md-3">
              <label for="ididade" class="form-label">Idade</label>
              <input id="ididade" type="number" class="form-control" placeholder="Ex: 20" min="0" />
            </div>

            <div class="col-md-3">
              <label for="idnotafinal" class="form-label">Nota Final</label>
              <input id="idnotafinal" type="number" class="form-control" placeholder="0 a 10" min="0" max="10" step="0.1" />
            </div>

            <div class="col-md-6">
              <label for="idcurso" class="form-label">Curso</label>
              <select id="idcurso" class="form-select">
                <option selected disabled>Escolha o curso...</option>
                <option value="1">JavaScript</option>
                <option value="2">Python</option>
                <option value="3">Java</option>
              </select>
            </div>

          

        <div class="col-md-6 d-flex align-items-end">
  <button id="btnCadastrar" class="btn btn-modern w-100 py-2">Cadastrar Aluno</button>
</div>
</div> <!-- ← fecha o row g-3 -->

<!-- novo botão para relatórios -->
<div class="d-grid mt-3">
  <a href="./relatorio.html" class="btn btn-outline-dark py-2 fw-semibold">
    📊 Ir para Relatórios
  </a>
</div>


        <div class="card p-3">
          <h5 class="text-center text-dark mb-3">Alunos Cadastrados</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nome</th>
                  <th>Idade</th>
                  <th>Curso</th>
                  <th>Nota</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaAluno"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- scripts -->
  <script src="./js.aluno/core.js"></script>
  <script src="./js.aluno/pagina-cadastro-aluno.js"></script>
  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
