<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Alunos</title>

  <!-- Conectando o CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Sistema de Gerenciamento de Alunos</h1>

  <form id="formAluno">
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="number" id="idade" placeholder="Idade" required>
    <select id="curso">
      <option>JavaScript</option>
      <option>Python</option>
      <option>Java</option>
    </select>
    <input type="number" id="nota" placeholder="Nota Final" required>
    <button type="submit">Cadastrar</button>
  </form>

  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Curso</th>
        <th>Nota</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaAlunos"></tbody>
  </table>

  <section id="relatorios" style="width:80%;margin:20px auto 40px">
  <h2>Relatórios</h2>
  <div class="acoes-relatorios">
    <button id="btnAprovados">Aprovados (≥ 7)</button>
    <button id="btnMediaNota">Média das Notas</button>
    <button id="btnMediaIdade">Média das Idades</button>
    <button id="btnOrdemAlfabetica">Nomes A–Z</button>
    <button id="btnPorCurso">Qtd. por Curso</button>
  </div>

  <div id="saidaRelatorios" style="margin-top:12px"></div>
</section>


  <!-- Conectando o JS -->
  <script src="script.js"></script>
</body>
</html>
